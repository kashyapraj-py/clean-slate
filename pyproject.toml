[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanslate-workspace"
version = "0.1.0"
description = "A local-first, reversible developer workspace cleaner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kashyap Raj"}]
keywords = ["developer-tools", "cleanup", "disk-space", "python", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "platformdirs>=4.0,<6",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
web = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
cleanslate = "cleanslate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["cleanslate"]
ignore_missing_imports = true
check_untyped_defs = true
